name: homelab-searxng

services:
  searxng:
    image: searxng/searxng:2026.10.19-81371861f
    restart: unless-stopped
    environment:
      # Keep the host-side config owned by jirka; the container runs as root.
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./config:/etc/searxng:ro
      - ./cache:/var/cache/searxng
    expose:
      - "8080"
    networks:
      - homelab
    mem_limit: 384m
    cpus: "0.50"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges=true

networks:
  homelab:
    external: true
