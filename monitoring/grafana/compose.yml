name: homelab-grafana

services:
  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      GF_SERVER_ROOT_URL: "https://grafana.example.test/"
      GF_SERVER_DOMAIN: "grafana.example.test"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    expose:
      - "3000"
    networks:
      - homelab
    mem_limit: 384m
    cpus: "0.50"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges=true

volumes:
  grafana-data:
    external: true
    name: monitoring_grafana-data

networks:
  homelab:
    external: true
