name: homelab-jellyfin

services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - JELLYFIN_PublishedServerUrl=https://jellyfin.example.test
    volumes:
      - ./config:/config
      - ./cache:/cache
      - ./media:/media:ro
    expose:
      - "8096"
    networks:
      - homelab
    mem_limit: 768m
    cpus: "1.00"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8096/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges=true

networks:
  homelab:
    external: true
